{% extends "webapp/templates/webapp_base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<section class="container py-5">
  <h2 class="text-center fw-bold mb-4" id="Services">Our Services</h2>
  <div class="row">
    {% for service in services %}
    <div class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        {% if service.service_image %}
        <img src="{{ service.service_image }}" class="card-img-top">
        {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{ service.service_name }}</h5>
          <p class="card-text">{{ service.short_description }}</p>
          <a href="/{{ service.route }}#{{ service.name }}" class="btn btn-outline-primary">
            Read More
          </a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
