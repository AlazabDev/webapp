<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>{% block title %}{{ _("شركة العزب") }}{% endblock %}</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="{% block description %}{{ _('شركة العزب للمقاولات العامة والتوريدات المتكاملة وإدارة المرافق.') }}{% endblock %}">
  <meta name="keywords" content="{% block keywords %}{{ _('العزب, مقاولات, تشطيبات, توريدات, إدارة مرافق, Al Azab, Contracting, Facility Management') }}{% endblock %}">
  <meta name="author" content="Al Azab Company">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ frappe.utils.get_url() }}{{ frappe.request.path }}">
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ self.description() }}{% endblock %}">
  <meta property="og:image" content="{% block og_image %}https://al-azab.co/w.png{% endblock %}">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ frappe.utils.get_url() }}{{ frappe.request.path }}">
  <meta property="twitter:title" content="{% block twitter_title %}{{ self.title() }}{% endblock %}">
  <meta property="twitter:description" content="{% block twitter_description %}{{ self.description() }}{% endblock %}">
  <meta property="twitter:image" content="{% block twitter_image %}https://al-azab.co/w.png{% endblock %}">

  {% block meta %}{% endblock %}

  <!-- Favicons -->
  <link href="/assets/webapp/images/favicon.png" rel="icon">
  <link href="/assets/webapp/images/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  {% if lang == 'ar' %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  {% endif %}
  <link href="/assets/webapp/css/webapp.bundle.css" rel="stylesheet">

  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}index-page{% endblock %}">

  {% include "webapp/templates/includes/header.html" %}

  <main class="main" id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include "webapp/templates/includes/footer.html" %}

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Main JS File -->
  <script type="text/javascript" src="/assets/webapp/js/webapp.bundle.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
