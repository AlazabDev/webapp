{% extends "webapp/templates/webapp_base.html" %}

{% block content %}

<!-- Page Header -->
<section class="py-4 bg-white border-bottom">
	<div class="container-fluid px-lg-5">
		<h2 class="fw-bold mb-1">Blog</h2>
		<p class="text-muted mb-0">
			Articles, updates, and technical insights
		</p>
	</div>
</section>

<section class="py-4 bg-light">
	<div class="container-fluid px-lg-5">
		<div class="row g-4">

			<!-- MAIN BLOG CONTENT -->
			<main class="col-lg-8">
				<div class="row g-4">

					<!-- Blog Card -->
					<div class="col-md-6">
						<div class="card h-100 border-0 shadow-sm">
							<img src="https://picsum.photos/600/400?random=11" class="card-img-top" alt="Blog image">

							<div class="card-body d-flex flex-column">
								<span class="badge bg-primary mb-2 align-self-start">
									Technology
								</span>

								<h5 class="fw-bold">
									How ERPNext Scales for Growing Businesses
								</h5>

								<p class="text-muted small">
									Understand architecture, performance tuning, and real-world scaling.
								</p>

								<a href="#" class="btn btn-sm btn-outline-primary mt-auto">
									Read Article →
								</a>
							</div>
						</div>
					</div>
				</div>
			</main>

		</div>
	</div>
</section>
<script>
  window.pageContext = {{ all_blogs | tojson | safe }};	
</script>

{% endblock %}
