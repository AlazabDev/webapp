{% extends "webapp/templates/webapp_base.html" %}

{% block content %}

  


  
  
    
<section class="hero">
  <div class="container hero-inner">
    <div>
      <span class="badge" data-i18n="brand.badge"></span>
      <h1 data-i18n="brand.title"></h1>
      <p class="lead" data-i18n="brand.subtitle"></p>
      <div class="cta">
        <a class="btn primary" href="/quote.html" data-i18n="cta.requestQuote"></a>
        <a class="btn" href="/projects.html" data-i18n="cta.viewProjects"></a>
      </div>
    </div>
    <div class="lead-img">16:10 Placeholder — Add hero image / video here</div>
  </div>
</section>
<section class="section">
  <div class="container grid cards">
    <div class="card" style="grid-column:span 6">
      <span class="tag" data-i18n="brand.sections.offices.tag"></span>
      <h3 data-i18n="brand.sections.offices.title"></h3>
      <p data-i18n="brand.sections.offices.text"></p>
    </div>
    <div class="card" style="grid-column:span 6">
      <span class="tag" data-i18n="brand.sections.retail.tag"></span>
      <h3 data-i18n="brand.sections.retail.title"></h3>
      <p data-i18n="brand.sections.retail.text"></p>
    </div>
  </div>
</section>


  

  
  
      
{% endblock %}
