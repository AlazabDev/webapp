{%- set post = doc -%}
<div class="col-md-6">
	<div class="card h-100 border-0 shadow-sm blog-card-container rounded-4">
		{% if post.cover_image %}
		<img src="{{ post.cover_image }}" class="card-img-top rounded-top" alt="Blog image">
		{% else %}
		<div class="default-cover rounded-top">
			<span>{{ post.title }}</span>
		</div>
		{% endif %}

		<div class="card-body d-flex flex-column">
			<span class="badge bg-primary mb-2 align-self-start">
				{{ post.category.title }}
			</span>

			<h5 class="fw-bold">
				{%- if post.featured -%}
				<h5 class="mt-1"><span class="text-dark">{{ post.title }}</span></h5>
				{%- else -%}
				<h5 class="mt-1"><span class="text-dark">{{ post.title }}</span></h5>
				{%- endif -%}
			</h5>

			<p class="text-muted small">
				{{ post.intro }}
			</p>

			<a href="/{{ post.route }}" class="btn btn-sm btn-outline-primary mt-auto">
				Read Article →
			</a>
		</div>
	</div>
</div>

<!-- Add this CSS for Glassy Material Design Effect with Rounded Corners -->
<style>
	/* Material Design Glassy Card Container */
	.blog-card-container {
		border-radius: 16px;
		overflow: hidden;
		background: rgba(255, 255, 255, 0.8);
		backdrop-filter: blur(10px);
		transition: transform 0.3s ease, box-shadow 0.3s ease;
	}

	/* Hover effect for Material Design feel */
	.blog-card-container:hover {
		transform: scale(1.02);
		box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
	}

	/* Default cover styling */
	.default-cover {
		background: #f1f1f1;
		display: flex;
		justify-content: center;
		align-items: center;
		height: 200px;
		font-size: 1.5rem;
		color: #ccc;
		text-align: center;
	}

	/* Image styling */
	.card-img-top {
		object-fit: cover;
		width: 100%;
		height: 200px;
	}

	/* Body styling */
	.card-body {
		padding: 20px;
	}

	/* Button styling for a Material Design look */
	.btn-outline-primary {
		border-radius: 30px;
		font-weight: bold;
	}

	/* Title Styling */
	h5 .text-dark {
		font-weight: 600;
		font-size: 1.25rem;
	}

	/* Text description */
	.text-muted.small {
		color: #6c757d;
		font-size: 0.9rem;
	}
</style>
