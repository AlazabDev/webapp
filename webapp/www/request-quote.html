{% extends "webapp/templates/webapp_base.html" %}
{% block title %}طلب عرض سعر | شركة العزب{% endblock %}
{% block content %}
<section class="page-hero"><div class="container"><span class="eyebrow">طلب جديد</span><h1>أرسل بيانات المشروع أو الخدمة</h1><p>يتم تحويل البيانات إلى رسالة واتساب منظمة لبدء المتابعة فورًا.</p></div></section>
<section class="section-space"><div class="container"><div class="form-card mx-auto">
<form id="quoteForm" novalidate>
<div class="row g-3">
<div class="col-md-6"><label class="form-label" for="customerName">الاسم</label><input class="form-control" id="customerName" required></div>
<div class="col-md-6"><label class="form-label" for="customerPhone">رقم الهاتف</label><input class="form-control" id="customerPhone" type="tel" required></div>
<div class="col-md-6"><label class="form-label" for="serviceType">الخدمة</label><select class="form-select" id="serviceType" required><option value="">اختر الخدمة</option>{% for service in services %}<option value="{{ service.service_name }}" data-name="{{ service.name }}">{{ service.service_name }}</option>{% endfor %}<option value="طلب آخر">طلب آخر</option></select></div>
<div class="col-md-6"><label class="form-label" for="projectLocation">الموقع</label><input class="form-control" id="projectLocation" required></div>
<div class="col-12"><label class="form-label" for="requestDetails">تفاصيل الطلب</label><textarea class="form-control" id="requestDetails" rows="5" required></textarea></div>
<div class="col-12"><button class="btn btn-brand btn-lg w-100" type="submit"><i class="bi bi-whatsapp ms-2"></i>إرسال عبر واتساب</button></div>
</div>
</form>
</div></div></section>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const form = document.getElementById('quoteForm');
  const serviceSelect = document.getElementById('serviceType');
  const requestedService = new URLSearchParams(window.location.search).get('service');
  if (requestedService) {
    const option = Array.from(serviceSelect.options).find(item => item.dataset.name === requestedService);
    if (option) option.selected = true;
  }
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }
    const lines = [
      'طلب جديد من موقع شركة العزب',
      `الاسم: ${document.getElementById('customerName').value.trim()}`,
      `الهاتف: ${document.getElementById('customerPhone').value.trim()}`,
      `الخدمة: ${serviceSelect.value}`,
      `الموقع: ${document.getElementById('projectLocation').value.trim()}`,
      `التفاصيل: ${document.getElementById('requestDetails').value.trim()}`,
    ];
    window.open(`https://wa.me/201004006620?text=${encodeURIComponent(lines.join('\n'))}`, '_blank', 'noopener');
  });
})();
</script>
{% endblock %}
